[package]
name = "morfo-wgpu"
description = "GPU renderer for morfo-ui (wgpu): one instanced draw per clip region, no CPU rasterizing."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "../../README.md"
keywords = ["gui", "ui", "renderer", "wgpu", "gpu"]
categories = ["gui", "rendering"]

[dependencies]
morfo = { package = "morfo-ui", path = "../morfo", version = "0.1.0" }
wgpu = "30"
ab_glyph = "0.2"
bytemuck = { version = "1", features = ["derive"] }

[dev-dependencies]
pollster = "1"
morfo-skia = { path = "../morfo-skia" }
tiny-skia = { version = "0.11", default-features = false, features = ["std", "png-format"] }
