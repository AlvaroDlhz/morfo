[package]
name = "morfo-web"
description = "Web backend for morfo-ui: paints on an HTML canvas and wires browser events (WebAssembly)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "../../README.md"
keywords = ["gui", "ui", "wasm", "web", "canvas"]
categories = ["gui", "wasm", "web-programming"]

[dependencies]
morfo = { package = "morfo-ui", path = "../morfo", version = "0.1.0" }
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "AddEventListenerOptions", "CanvasGradient", "CanvasRenderingContext2d", "Clipboard", "ClipboardEvent", "CompositionEvent", "CssStyleDeclaration",
    "DataTransfer", "Document", "DomRect", "Element", "Event", "EventTarget", "HtmlCanvasElement", "HtmlElement", "HtmlTextAreaElement", "ImageData", "InputEvent", "Node",
    "KeyboardEvent", "Location", "MouseEvent", "Navigator", "Performance", "PointerEvent", "Storage", "TextMetrics",
    "WheelEvent", "Window",
] }
