[package]
name = "morfo-skia"
description = "CPU renderer for morfo (tiny-skia + ab_glyph). Runs anywhere, no GPU needed."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "../../README.md"
keywords = ["gui", "ui", "renderer", "software-rendering"]
categories = ["gui", "rendering"]

[dependencies]
morfo = { package = "morfo-ui", path = "../morfo", version = "0.1.0" }
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }
ab_glyph = "0.2"
