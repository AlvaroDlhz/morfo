name: CI

on:
  push:
    branches: [main]
  pull_request:

# Only what the checks need: the code, nothing else.
permissions:
  contents: read

# A new push to the same PR cancels the run still going for the old one.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Fonts for the renderer
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets
      - name: Clippy (WebAssembly)
        run: cargo clippy -p morfo-web -p morfo-web-demo --target wasm32-unknown-unknown
      # The GPU comparison test skips itself when the runner has no GPU.
      - name: Tests
        run: cargo test --workspace
      # Drives the documentation app headlessly through every page, checks
      # that partial repaints match full repaints pixel for pixel, and that
      # the interface comes to rest. The frames are kept as an artifact.
      - name: Visual run
        run: cargo run --release -p morfo-demo --bin snapshot
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frames
          path: out/
