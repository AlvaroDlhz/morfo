[package]
name = "morfo-demo"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
morfo = { package = "morfo-ui", path = "../crates/morfo" }

# The window, the renderers and the system integrations are desktop only:
# the web version (../web) reuses this crate's interface without them.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
morfo-live = { path = "../crates/morfo-live" }
morfo-skia = { path = "../crates/morfo-skia" }
morfo-wgpu = { path = "../crates/morfo-wgpu" }
pollster = "1"
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd", "png-format"] }
winit = "0.30"
softbuffer = "0.4"
arboard = { version = "3", default-features = false }
accesskit = "0.17"
accesskit_winit = "0.23"

# X11 only: a window that comes back from a live reload must not take the
# keyboard from the editor (see `appear_unfocused` in the `docs` binary).
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
x11rb = "0.13"
