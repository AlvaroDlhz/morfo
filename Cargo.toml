[workspace]
resolver = "2"
members = ["crates/morfo", "crates/morfo-live", "crates/morfo-skia", "crates/morfo-wgpu", "crates/morfo-web", "demo", "web"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/AlvaroDlhz/morfo"
rust-version = "1.88"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# Keep the software rasterizer fast even in debug builds.
[profile.dev.package."*"]
opt-level = 2
